name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true
          # Opcional: una rama de Neon para probar la compra completa
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
